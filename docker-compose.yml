services:

  reverse-proxy:
    image: traefik:v3.7
    command: 
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=orcaml_orcaml_network"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - orcaml_network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - orcaml_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - orcaml_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.0
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - orcaml_network
    volumes:
      - mlflow_data:/mlflow
    environment:
      MLFLOW_ALLOW_ORIGIN: "*"
      GUNICORN_CMD_ARGS: "--forwarded-allow-ips=* --workers 1 --timeout 120"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts

  app:
    image: moubakhta/orcaml-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - models_data:/app/models
      - mlflow_data:/mlflow
    ports:
      - "8000:8000"
    networks:
      - orcaml_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  worker:
    image: moubakhta/orcaml-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - models_data:/app/models
      - mlflow_data:/mlflow
    networks:
      - orcaml_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    command: celery -A src.config.celery.celery worker --loglevel=info

  model-server:
    image: moubakhta/orcaml-model-server:${IMAGE_TAG:-latest}
    build:
      context: ./model-server  # path to the Dockerfile
    profiles:
      - build-only
    networks:
      - orcaml_network

networks:
  orcaml_network:
    driver: bridge

volumes:
  postgres_data:
  mlflow_data:
  models_data: