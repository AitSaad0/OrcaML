name: CD — Deploy to AWS EC2

on:
  workflow_run:
    workflows: ["ci"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:

  build-and-push:
    name: 🐳 Build & Push to Docker Hub
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tag (short SHA)
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push — app
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/orcaml-app:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/orcaml-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push — model-server
        uses: docker/build-push-action@v5
        with:
          context: ./src/docker/model-server
          file: ./src/docker/model-server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/orcaml-model-server:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/orcaml-model-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/OrcaML

            export IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }}

            echo "▶ Pull des images (tag: $IMAGE_TAG)..."
            IMAGE_TAG=$IMAGE_TAG docker compose pull app worker model-server

            echo "▶ Migrations Alembic..."
            IMAGE_TAG=$IMAGE_TAG docker compose run --rm app alembic upgrade head

            echo "▶ Redémarrage des services..."
            IMAGE_TAG=$IMAGE_TAG docker compose up -d --remove-orphans

            echo "⏳ Health check..."
            sleep 8
            for i in $(seq 1 10); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ App en ligne — version $IMAGE_TAG déployée"
                break
              fi
              echo "   Tentative $i/10 — status: $STATUS"
              sleep 5
            done
            if [ "$STATUS" != "200" ]; then
              echo "❌ Health check échoué"
              IMAGE_TAG=$IMAGE_TAG docker compose logs --tail=40 app
              exit 1
            fi

            docker image prune -f
            echo "🎉 Déploiement $IMAGE_TAG terminé !"